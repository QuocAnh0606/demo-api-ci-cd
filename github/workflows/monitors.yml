name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run monitor
        run: |
          MONITOR="./Monitor_Collection.json"

          if [ ! -f "$MONITOR" ]; then
            echo "Missing file: $MONITOR"
            find . -maxdepth 2 -type f -not -path './.git/*' | sort
            exit 1
          fi

          newman run "$MONITOR"
