name: Restful-Booker CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Lấy code
        uses: actions/checkout@v4

      - name: 2. Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Cài Newman
        run: npm install -g newman

      - name: 4. Chạy bộ Test tự động
        shell: bash
        run: |
          set -euo pipefail

          COLLECTION="./RestfulBooker_API_Collection.postman_collection.json"
          ENVFILE="./RestfulBooker_Env.postman_environment.json"
          DATA="./booking_data.csv"

          echo "=== Kiểm tra file ==="
          ls -la

          for f in "$COLLECTION" "$ENVFILE" "$DATA"; do
            if [ ! -f "$f" ]; then
              echo "Missing file: $f"
              exit 1
            fi
          done

          echo "Collection: $COLLECTION"
          echo "Environment: $ENVFILE"
          echo "Data: $DATA"

          newman run "$COLLECTION" \
            -e "$ENVFILE" \
            -d "$DATA" \
            --reporters cli,html \
            --reporter-html-export report.html

      - name: 5. Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: report.html
