name: Restful-Booker CI Pipeline
on: [push, pull_request]

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. Cài đặt Newman và htmlextra reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: 4. Chạy bộ Test tự động
        run: |
          newman run RestfulBooker_API_Collection.postman_collection.json \
            -e RestfulBooker_Env.postman_environment.json \
            -d booking_data.csv \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: 5. Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: report.html
