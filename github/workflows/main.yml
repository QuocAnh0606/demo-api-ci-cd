name: ReqRes API CI Pipeline
on: [push, pull_request]

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: 4. Run automated tests
        run: |
          newman run 2474802010010_NguyenHuynhQuocAnh_ReqRes.postman_collection.json \
            -e 2474802010010_NguyenHuynhQuocAnh_ReqRes_Env.postman_environment.json \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "userId=2" \
            --env-var "api_key=reqres-demo-key" \
            --env-var "userToken=demo-token" \
            -d users.csv \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: 5. Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: report.html
